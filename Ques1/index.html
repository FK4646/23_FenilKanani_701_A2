<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ques1 - React CDN Components</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(13, 110, 253, 0.18), transparent 32rem),
          linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
        color: #172033;
      }

      .page-shell {
        max-width: 1080px;
      }

      .hero-panel {
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(12px);
      }

      .stat-box {
        border-radius: 14px;
        background: #0f172a;
        color: #f8fafc;
      }

      .assignment-card {
        border: 0;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.09);
      }

      .subject-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #dbe4f0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #ffffff;
        font-weight: 500;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #0d6efd;
      }
    </style>
  </head>
  <body>
    <main class="container page-shell py-5">
      <div id="root"></div>
    </main>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function StudentCard() {
        return (
          <div className="card assignment-card h-100">
            <div className="card-body p-4">
              <span className="badge text-bg-primary mb-3">Component 1</span>
              <h2 className="h3 mb-3">Student Profile</h2>
              <div className="vstack gap-3">
                <div>
                  <p className="text-secondary small text-uppercase mb-1">Name</p>
                  <p className="fs-5 fw-semibold mb-0">Fenil Kanani</p>
                </div>
                <div>
                  <p className="text-secondary small text-uppercase mb-1">Course</p>
                  <p className="fs-5 fw-semibold mb-0">React Assignment</p>
                </div>
                <div>
                  <p className="text-secondary small text-uppercase mb-1">Approach</p>
                  <p className="fs-5 fw-semibold mb-0">React using CDN</p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function SubjectList() {
        const subjects = ["React Components", "JSX", "Props", "Lists"];

        return (
          <div className="card assignment-card h-100">
            <div className="card-body p-4">
              <span className="badge text-bg-success mb-3">Component 2</span>
              <h2 className="h3 mb-3">Subjects Covered</h2>
              <div className="d-flex flex-wrap gap-2">
                {subjects.map((subject) => (
                  <span className="subject-pill" key={subject}>
                    <span className="dot"></span>
                    {subject}
                  </span>
                ))}
              </div>
              <p className="text-secondary mt-4 mb-0">
                This component displays data using array mapping inside JSX.
              </p>
            </div>
          </div>
        );
      }

      function App() {
        return (
          <>
            <section className="hero-panel p-4 p-md-5 mb-4">
              <div className="row align-items-center g-4">
                <div className="col-lg-8">
                  <p className="text-primary fw-semibold text-uppercase mb-2">Question 1</p>
                  <h1 className="display-5 fw-bold mb-3">React Components with CDN</h1>
                  <p className="lead text-secondary mb-0">
                    A simple React page built without Vite or CRA, using CDN scripts and Bootstrap 5 styling.
                  </p>
                </div>
                <div className="col-lg-4">
                  <div className="stat-box p-4">
                    <p className="text-white-50 mb-1">Total Components</p>
                    <div className="display-4 fw-bold">2</div>
                    <p className="mb-0 text-white-50">Student card and subject list</p>
                  </div>
                </div>
              </div>
            </section>

            <section className="row g-4">
              <div className="col-md-6">
                <StudentCard />
              </div>
              <div className="col-md-6">
                <SubjectList />
              </div>
            </section>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
